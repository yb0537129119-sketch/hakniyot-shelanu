<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f6ff">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
<title>הקניות שלנו</title>
</head>
<body>
<header class="header">
  <div class="actions">
    <button class="icon-btn" id="settingsBtn" aria-label="הגדרות">⚙️</button>
    <button class="icon-btn" id="familyBtn" aria-label="משפחה">👥</button>
  </div>
  <div class="heading"><h1>הקניות שלנו</h1><p id="subtitle">הבית שלנו</p></div>
</header>

<section id="settingsPanel" class="settings-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="settings-card">
    <div class="settings-head"><h2 id="settingsTitle">הגדרות</h2><button id="closeSettings" class="settings-close" aria-label="סגירה">×</button></div>
    <p>בחר איך ייראה המסך</p>
    <div class="theme-options">
      <button id="lightThemeBtn" class="theme-choice" type="button">☀️ מצב בהיר</button>
      <button id="darkThemeBtn" class="theme-choice" type="button">🌙 מצב כהה</button>
    </div>
  </div>
</section>
<main>
  <section id="login" class="login hidden">
    <h2>שלום למשפחה!</h2>
    <p>בחרו משפחה והזינו סיסמה</p>
    <div id="familyChoices" class="family-grid"></div>
    <input id="password" type="password" placeholder="סיסמת המשפחה" autocomplete="current-password">
    <button id="loginBtn" class="primary">כניסה</button>
    <p id="loginError" class="error"></p>
  </section>

  <section id="home">
    <div id="categories" class="categories"></div>
  </section>

  <section id="categoryPage" class="hidden">
    <button id="backBtn" class="back">‹ חזרה</button>
    <div class="category-title"><span id="categoryIcon"></span><div><h2 id="categoryName"></h2><p id="count">0 מוצרים לקנייה</p></div></div>
    <div class="add-row">
      <input id="newProduct" placeholder="הוספת מוצר לרשימה" maxlength="100" autocomplete="off">
      <button id="voiceBtn" class="voice-btn" type="button" aria-label="הוספת מוצר בדיבור" title="הוספה בדיבור">🎤</button>
      <button id="addBtn" class="primary">הוספה</button>
    </div>
    <div id="products" class="products"></div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
